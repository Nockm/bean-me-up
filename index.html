<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bean me up">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <title>Bean me up</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <div class="intro"><h1>On the menu</h1></div>
    <section class="coffee-picker" aria-label="Available coffees" tabindex="0">
      <div class="deck" id="deck"><p class="message">Putting the coffee on…</p></div>
      <div class="navigation" id="navigation" hidden>
        <button class="arrow" id="previous" aria-label="Previous coffee"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg></button>
        <div class="position"><p id="counter" aria-live="polite"></p><div class="dots" id="dots" aria-label="Choose a coffee"></div></div>
        <button class="arrow" id="next" aria-label="Next coffee"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6M16 12H4"/></svg></button>
      </div>
    </section>
  </main>
  <dialog id="gallery" aria-labelledby="gallery-title">
    <div class="gallery-header"><h2 id="gallery-title"></h2><button id="gallery-close" class="gallery-close" aria-label="Close photos">✕</button></div>
    <div class="gallery-stage"><img id="gallery-image" alt=""></div>
    <p id="image-error" hidden>This image couldn’t load. Try another photo.</p>
    <div class="gallery-navigation">
      <button id="image-previous" class="arrow" aria-label="Previous photo">←</button>
      <p id="image-counter" aria-live="polite"></p>
      <button id="image-next" class="arrow" aria-label="Next photo">→</button>
    </div>
    <div id="thumbnails" class="thumbnails" aria-label="Choose a photo"></div>
    <p class="gallery-hint">Swipe through photos · tap outside to return</p>
  </dialog>
  <div class="app-meta">
    <span>Last updated <time datetime="2026-10-25T11:46:17Z">25 Oct 2026, 11:46 GMT</time></span>
    <span class="app-version">Version 8</span>
  </div>
</body>
</html>
